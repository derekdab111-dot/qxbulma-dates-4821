<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="color-scheme" content="dark light"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Bulma Briefs"><meta name="theme-color" content="#06121c"><meta name="format-detection" content="telephone=no">
<title>Bulma Briefs — Date Night at Capsule Corp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Exo+2:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#06121c;--bg2:#0d2233;--card:rgba(255,255,255,.055);--hov:rgba(255,255,255,.1);--tx:#eaf6ff;--mu:#8fb3c9;--ac:#19d3c5;--ac2:#4aa3ff;--gold:#ffb347;--bd:rgba(255,255,255,.09);--sh:0 10px 36px rgba(0,0,0,.4)}
[data-theme=light]{--bg:#eef8ff;--bg2:#fff;--card:#fff;--hov:#e6f6ff;--tx:#06233a;--mu:#496a80;--bd:rgba(0,0,0,.1);--sh:0 10px 30px rgba(74,163,255,.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 45% at 15% -10%,rgba(25,211,197,.22),transparent),radial-gradient(ellipse 60% 40% at 95% 5%,rgba(74,163,255,.18),transparent),radial-gradient(ellipse 50% 30% at 50% 110%,rgba(255,179,71,.1),transparent)}
.wrap{position:relative;max-width:1080px;margin:0 auto;padding:0 16px 90px}
header{text-align:center;padding:34px 0 14px}
.logo{display:inline-block;padding:.05em .25em .2em;font:400 clamp(2.4rem,8vw,3.8rem)/1.2 'Pacifico','Segoe Script','Lucida Handwriting','Brush Script MT',cursive;letter-spacing:.01em;background:linear-gradient(110deg,var(--ac),var(--ac2),var(--gold),var(--ac));background-size:250% 100%;animation:shimmer 7s linear infinite;filter:drop-shadow(0 4px 14px rgba(25,211,197,.25));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.balls{margin:10px 0 4px}.ball{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;margin:0 3px;background:radial-gradient(circle at 35% 30%,#ffd98a,#ff9f1c 60%,#c25e00);color:#c1121f;font-size:.62rem;font-weight:800;opacity:.22;filter:grayscale(.6);transition:.4s}.ball.on{opacity:1;filter:none;box-shadow:0 0 14px rgba(255,159,28,.7)}
#sub{color:var(--mu);font-size:.85rem}
.nav{position:sticky;top:8px;z-index:20;display:flex;gap:4px;padding:5px;margin:8px 0 16px;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);overflow-x:auto}
.nav button{flex:1;white-space:nowrap;padding:9px 12px;border:0;border-radius:12px;background:none;color:var(--mu);font:600 .88rem 'Inter',system-ui,sans-serif;cursor:pointer}
.nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.nav b{font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
.b{padding:9px 14px;border:1px solid var(--bd);background:var(--bg2);border-radius:12px;cursor:pointer;transition:.2s;font-size:.88rem}
.b:hover,.b.on{border-color:var(--ac);color:var(--ac)}
.b.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff}.b.big{padding:12px 22px;font-weight:700}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--mu);cursor:pointer;transition:.2s}
.ib:hover,.ib.on{color:var(--ac);border-color:var(--ac)}
input,select,textarea{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.bar input{flex:1;min-width:180px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;display:grid;gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--bd);background:none;color:var(--mu);cursor:pointer;font-size:.8rem}
.chip.on{background:var(--ac);border-color:var(--ac);color:#06121c;font-weight:600}
.count{color:var(--mu);font-size:.8rem;margin:2px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;align-items:start}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;cursor:pointer;transition:border .2s,background .2s}
.card:hover{background:var(--hov);border-color:rgba(25,211,197,.35)}
.card.sex .em{filter:drop-shadow(0 0 6px rgba(255,179,71,.6))}
.card.done{opacity:.55}.card.done h3{text-decoration:line-through}
.ch{display:flex;align-items:flex-start;gap:10px}.em{font-size:1.4rem;line-height:1.2}
h3{flex:1;font:700 1rem/1.3 'Exo 2',sans-serif}
.ca{display:flex;gap:4px}.ca .ib{width:30px;height:30px}
.ds{color:var(--mu);font-size:.88rem;margin:8px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.open .ds{display:block}
.mt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tg{font-size:.7rem;color:var(--mu);border:1px solid var(--bd);padding:2px 8px;border-radius:99px}.tg.c{color:var(--ac)}.ht{font-size:.7rem}
.more{display:none;margin-top:12px;border-top:1px solid var(--bd);padding-top:10px}.open .more{display:block}
.tp{font-size:.82rem;color:var(--gold);margin-bottom:8px}
.rate{display:flex;gap:6px;margin:8px 0}
.rb{width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;font-size:.7rem;font-weight:800;color:#c1121f;background:radial-gradient(circle at 35% 30%,#ffd98a,#ff9f1c 60%,#c25e00);opacity:.28;filter:grayscale(.5);transition:.2s}
.rb.on{opacity:1;filter:none;box-shadow:0 0 10px rgba(255,159,28,.6)}
.tagin{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tin{padding:5px 10px;width:110px;font-size:.8rem}
.rt{border:0;background:rgba(25,211,197,.15);color:var(--ac);border-radius:99px;padding:3px 9px;font-size:.75rem;cursor:pointer}
.note{width:100%;font-size:.85rem;resize:vertical;margin-bottom:8px}
body.blur .card.sex:not(.open) .ds{filter:blur(6px)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:50px 10px}
#more{display:block;margin:18px auto}
.rollbox{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin:6px 0 14px;overflow:hidden}
.rr{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}
.rl{color:var(--mu);font-size:.8rem}.rv{font-weight:600}.rr .ib{margin-left:4px}
.cd{padding:10px 14px;color:var(--mu);font-size:.78rem}code{color:var(--ac)}
.two{display:grid;grid-template-columns:1fr 1fr}.pc+.pc{border-left:1px solid var(--bd)}.pc h4{padding:12px 14px 0;font:700 1rem 'Exo 2',sans-serif}
.rc{margin-bottom:10px}
details{margin-top:10px}summary{cursor:pointer;color:var(--mu)}
.sv{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.85rem}.sv span{flex:1}
.over{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(5px);z-index:100;display:none;place-items:center;padding:16px}.over.show{display:grid}
.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:22px;padding:26px;max-width:440px;width:100%;text-align:center;box-shadow:var(--sh)}
.modal h3{font-size:1.3rem;margin:6px 0}.modal p{color:var(--mu);margin:8px 0 16px}
#side{position:fixed;top:0;right:0;height:100%;width:min(360px,92vw);background:var(--bg2);border-left:1px solid var(--bd);z-index:150;transform:translateX(105%);transition:transform .3s;padding:20px;overflow:auto;box-shadow:var(--sh)}
#side.show{transform:none}#side h3{margin-bottom:12px}#side .row{margin-top:12px}
.sl{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:.88rem}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);background:var(--bg2);border:1px solid var(--bd);padding:10px 18px;border-radius:12px;box-shadow:var(--sh);z-index:300;transition:transform .3s;font-size:.88rem}
#toast.show{transform:translate(-50%,0)}#toast .b{padding:3px 10px;margin-left:8px}
.cf{position:fixed;top:-24px;z-index:300;pointer-events:none;animation:fall 1.9s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(540deg);opacity:0}}
#cloak{display:none;position:fixed;inset:0;z-index:999;background:#fff;color:#222;padding:48px;font-family:Arial,sans-serif}body.cloak #cloak{display:block}
@media(max-width:620px){.two{grid-template-columns:1fr}.pc+.pc{border-left:0;border-top:1px solid var(--bd)}.rr{grid-template-columns:1fr auto}.rl{grid-column:1/-1}.nav{top:4px}}
#pin .dots{display:flex;gap:14px;justify-content:center;margin:4px 0}#pin .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ac)}#pin .dots i.on{background:var(--ac)}
#pin .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;width:100%}#pin .kb{height:58px;border-radius:50%;border:1px solid var(--bd);background:var(--bg2);font:600 1.3rem 'Inter',system-ui,sans-serif;color:var(--tx);cursor:pointer;transition:.15s}#pin .kb:active{background:var(--ac);color:#06121c;transform:scale(.94)}
#pin input#pH{font-size:.9rem;letter-spacing:0}
#surp,#lockNow{position:fixed;right:18px;z-index:30;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--bg2);box-shadow:var(--sh);cursor:pointer;font-size:1.1rem}#surp{bottom:78px}#lockNow{bottom:182px}
@media(min-width:900px){body.slim .nav button{display:block!important}body.slim .nav button::first-letter{font-size:1.25rem}body.slim .nav{overflow-x:hidden}}
#fixNav{position:fixed;top:10px;right:14px;z-index:35;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--bg2);color:var(--mu);font:600 .75rem 'Inter',system-ui,sans-serif;cursor:pointer;box-shadow:var(--sh)}#fixNav:hover{color:var(--ac);border-color:var(--ac)}
@media(max-width:899px){#fixNav{display:none}}

input,textarea,[contenteditable]{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text}
.nav,.nfoot{-webkit-backdrop-filter:blur(14px)}
@media(max-width:899px){
 .wrap{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));padding-bottom:calc(150px + env(safe-area-inset-bottom))}

 .grid{grid-template-columns:1fr}
 .card:hover{transform:none}

 #toTop{bottom:calc(150px + env(safe-area-inset-bottom))}#surp{bottom:calc(88px + env(safe-area-inset-bottom))}#lockNow{bottom:calc(206px + env(safe-area-inset-bottom))}
 .wishbtn{right:max(10px,env(safe-area-inset-right))!important;bottom:calc(14px + env(safe-area-inset-bottom))!important}
 #toast{bottom:calc(16px + env(safe-area-inset-bottom))}
 #pin{padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
 #pin .kb{height:68px;font-size:1.5rem}#pin .kp{max-width:290px;gap:12px}
}
@media(hover:none){.card:hover{transform:none;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pbar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:8px 0}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.card.lock{opacity:.6}.slot .ph{aspect-ratio:1;border-radius:12px;background:var(--bg2);border:1px solid var(--bd);display:grid;place-items:center;overflow:hidden;font-size:2.4rem}.slot .ph img{width:100%;height:100%;object-fit:cover}

[hidden]{display:none!important}
@keyframes shimmer{to{background-position:250% 0}}
@keyframes bob{50%{translate:0 -6px}}
@keyframes glow{50%{box-shadow:0 0 22px rgba(255,159,28,.95),0 0 40px rgba(255,159,28,.35)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(90deg)}}
@keyframes twirl{to{transform:rotateY(720deg) scale(1.25)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes land{0%{transform:translateY(-10px) scale(1.06);color:var(--gold)}60%{transform:translateY(2px) scale(1.02)}100%{transform:none}}
@keyframes flash{0%{background:rgba(25,211,197,.25)}100%{background:transparent}}
@keyframes dice{0%{transform:rotate(0) scale(1)}40%{transform:rotate(300deg) scale(1.4)}100%{transform:rotate(720deg) scale(1)}}
.ball{position:relative;cursor:pointer;animation:bob 3.2s ease-in-out infinite;animation-delay:calc(var(--i,0)*.28s);transition:transform .25s}
.ball:hover{transform:scale(1.25) rotate(-12deg)}
.ball.on{animation:bob 3.2s ease-in-out infinite,glow 2.6s ease-in-out infinite;animation-delay:calc(var(--i,0)*.28s),calc(var(--i,0)*.35s)}
.ball.on::after{content:"✦";position:absolute;top:-9px;right:-5px;font-size:.7rem;color:#fff6bf;animation:tw 2.2s ease-in-out infinite;animation-delay:calc(var(--i,0)*.4s)}
.ball.new{animation:pop .7s ease-out}
.ball.twirl{animation:twirl .8s ease-in-out}
.balls.all .ball{box-shadow:0 0 26px rgba(255,200,60,1),0 0 52px rgba(255,120,0,.5)}
.rv{display:inline-block;transition:filter .15s}.rv.spinning{filter:blur(1.4px);opacity:.7}.rv.land{animation:land .5s ease-out}
.rr.flash{animation:flash .9s ease-out}
.dice{display:inline-block}.rolling .dice{animation:dice .75s ease-in-out}
details.grp{background:var(--card);border:1px solid var(--bd);border-radius:16px;margin:0 0 10px;overflow:hidden}

details.grp>summary::-webkit-details-marker{display:none}

details.grp>.grid{padding:0 12px 12px}details.grp[open]{border-color:rgba(25,211,197,.35)}

.wishbtn{display:block;margin:10px auto 0;animation:wishpulse 1.8s ease-in-out infinite}
@keyframes wishpulse{50%{box-shadow:0 0 22px rgba(255,179,71,.9);transform:scale(1.05)}}
@keyframes slither{to{stroke-dashoffset:0}}@keyframes headin{from{opacity:0;transform:translate(210px,150px) scale(.4)}to{opacity:1;transform:translate(210px,100px) scale(1)}}
@keyframes lightning{0%,100%{opacity:0}4%{opacity:.85}8%{opacity:.1}12%{opacity:.7}18%{opacity:0}}
@keyframes eyes{50%{fill:#ffe14d}}@keyframes sink{to{transform:translateY(60%);opacity:0}}@keyframes sweep{to{transform:rotate(360deg)}}
.over.sh{z-index:500;background:radial-gradient(ellipse at 50% 0%,#17285c,#050818 72%);padding:0;overflow:auto}
.over.sh.show{display:flex;flex-direction:column;align-items:center}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.wbtn{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--bd);background:var(--card);cursor:pointer;color:var(--tx);transition:.2s}

.card{content-visibility:auto;contain-intrinsic-size:auto 150px}

body{background:var(--bg) fixed;letter-spacing:.005em}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(143,179,201,.3);border-radius:9px}
.card{backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.18)}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.35)}
.card,.b,.chip,.wbtn{transition:transform .18s,box-shadow .18s,border-color .2s,background .2s}.b:hover{transform:translateY(-1px)}
.b.p{box-shadow:0 6px 18px rgba(25,211,197,.3)}.panel{backdrop-filter:blur(8px);box-shadow:var(--sh)}
header{padding:28px 0 6px}#sub{letter-spacing:.04em}

["n", "Go on a run together", "Lace up, pick an easy pace, and finish with a cold drink and a stretch.", "Match your pace to the slower runner."],

 roll(k){const p=this.pool(k),old=this.seeds[k]==null?null:this.val(k);let s=newSeed();for(let i=0;i<8&&p.length>1;i++){s=newSeed();if(p[pickI(s,p.length)]!==old)break}this.seeds[k]=s},
 all(){slots.forEach(x=>{if(!this.locks[x.k]||this.seeds[x.k]==null)this.roll(x.k)});if(this.fix)this.fix();this.push()},
 one(k){this.roll(k);if(this.fix)this.fix();this.push()},
 back(){if(this.hi>0){this.hi--;this.seeds={...this.hist[this.hi]};return true}return false},
 fwd(){if(this.hi<this.hist.length-1){this.hi++;this.seeds={...this.hist[this.hi]};return true}return false},
 code(){return slots.map(x=>(this.seeds[x.k]>>>0).toString(36)).join("-")},
 load(c){const p=String(c).trim().toLowerCase().split("-");if(p.length!=slots.length||p.some(x=>!/^[0-9a-z]{1,7}$/.test(x)))return false;slots.forEach((x,i)=>this.seeds[x.k]=parseInt(p[i],36)>>>0);this.push();return true}}}

 else if(k=="rel"){const p=CCP.find(x=>x[0]==a.dataset.k),cost=ccCost(p);if(WS.z<cost||c.rel[p[0]])return;if(ccPend()>0){WS.z+=ccPend()}c.last=Date.now();WS.z-=cost;c.rel[p[0]]=Date.now();try{confetti()}catch(x){}toast("🚀 "+p[2]+" released!")}
 saveW();refresh();drawCC()};

<div id="pin" hidden role="dialog" aria-modal="true" aria-label="PIN"><div class="bx"><h2 id="pT">Enter PIN</h2><small id="pS"></small><div class="dots" id="pD" aria-live="polite"></div><input id="pH" maxlength="60" placeholder="Memory jogger hint (optional)" aria-label="Memory jogger hint" hidden><div class="er" id="pE"></div><div class="kp" id="pK"></div><button class="chip" id="pR" hidden>💭 Jog my memory</button><button class="chip" id="pSk" hidden>Skip for now</button></div></div>
<script>
(()=>{const P=document.getElementById("pin"),D=document.getElementById("pD"),E=document.getElementById("pE"),T=document.getElementById("pT"),S=document.getElementById("pS"),H=document.getElementById("pH"),KP=document.getElementById("pK"),R=document.getElementById("pR"),SK=document.getElementById("pSk"),KEY="bx_pin",HK="bx_pinhint",N=4;
const gl=k=>{try{return localStorage.getItem(k)}catch(e){return null}},sl=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let saved=gl(KEY),mode=saved?"ask":"set",buf="",first="";
const hash=async v=>{try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("bx:"+v));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of "bx:"+v)h=(h*33^c.charCodeAt(0))>>>0;return"f"+h}};
KP.innerHTML=["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>k?`<button class="kb" data-k="${k}" aria-label="${k=="⌫"?"Delete":k}">${k}</button>`:"<span></span>").join("");
const dots=()=>{D.innerHTML=Array.from({length:N},(_,i)=>`<i class="${i<buf.length?"on":""}"></i>`).join("")};
const gate=on=>[...document.body.children].forEach(n=>{if(n!==P&&n.tagName!="SCRIPT")n.inert=on});
const open=()=>{P.hidden=true;document.body.style.overflow="";buf="";gate(false)};
const lock=()=>{mode=gl(KEY)?"ask":"set";saved=gl(KEY);first="";buf="";E.textContent="";P.hidden=false;document.body.style.overflow="hidden";gate(true);dots();
 H.hidden=true;R.hidden=SK.hidden=true;
 if(mode=="set"){T.textContent="Create a PIN";S.textContent="4 digits, like unlocking a phone. Asked once each time the app opens.";SK.hidden=false}else{T.textContent="Enter PIN";S.textContent="";R.hidden=false}};
const bad=m=>{E.textContent=m;buf="";P.querySelector(".bx").animate([{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"none"}],{duration:220});dots()};
let busy=false;const done=async()=>{if(busy||buf.length<N)return;busy=true;const v=buf;try{await run(v)}finally{busy=false}};
const run=async v=>{
 if(mode=="ask"){if(await hash(v)==saved)open();else bad("Wrong PIN, try again")}
 else if(mode=="set"){first=v;buf="";mode="confirm";T.textContent="Confirm PIN";S.textContent="Enter it once more.";H.hidden=true;R.hidden=SK.hidden=true;dots()}

 else{sl(KEY,await hash(v));const h=H.value.trim();if(h)sl(HK,h);open()}};

addEventListener("keydown",e=>{if(P.hidden||e.target==H)return;e.stopPropagation();if(/^\d$/.test(e.key))press(e.key);else if(e.key=="Backspace")press("⌫")},true);
R.onclick=()=>{const h=gl(HK);E.textContent=h?"💭 Hint: "+h:"No hint was saved for this PIN."};
SK.onclick=()=>{sl(KEY,"");open()};
// hint field appears while creating the PIN
const sh=()=>{H.hidden=!(mode=="set"||mode=="confirm")};new MutationObserver(sh).observe(T,{childList:true,characterData:true,subtree:true});
